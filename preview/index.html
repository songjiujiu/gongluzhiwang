<!doctype html>
<html lang="zh-CN">
<head>

  <title>公路之王 · 无尽挑战</title>
  <style>
    :root { color-scheme: dark; font-family: "Microsoft YaHei", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #09121b; color: #a8bfcd; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; overflow-x: hidden; }
    header { text-align: center; font-size: 11px; line-height: 1.7; letter-spacing: .04em; }
    strong { color: #e8f6fa; font-size: 13px; }
    canvas { display: block; touch-action: none; outline: none; background: #112435; border-radius: 20px; box-shadow: 0 0 0 1px #3b5365, 0 20px 65px #0008; }
    #error { display: none; white-space: pre-wrap; max-width: 700px; padding: 20px; font-size: 13px; color: #ffb49a; }
    @media (max-width: 480px) { body { justify-content: flex-start; gap: 0; } header { display: none; } canvas { border-radius: 0; box-shadow: none; } }
  </style>
</head>

  <script src="/preview/browser-platform.js"></script>
